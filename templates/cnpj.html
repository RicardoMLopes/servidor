{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Selecionar Empresa</h5>
        </div>
        <div class="card-body">
            <form method="post" action="/cadusuarios/buscar-vendedores">
                <div class="mb-3">
                    <label for="cnpj" class="form-label">CNPJ da Empresa</label>
                    <input type="text" class="form-control {% if error %}is-invalid{% endif %}" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00" required>
                    {% if error %}
                    <div class="invalid-feedback">
                        {{ error }}
                    </div>
                    {% endif %}
                </div>
                <button type="submit" class="btn btn-primary">Consultar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
