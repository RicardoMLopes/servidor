{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-sm w-100" style="max-width: 400px;">
        <div class="card-header bg-primary text-white text-center">
            <h5 class="mb-0"><i class="bi bi-building"></i> Selecionar Empresa</h5>
        </div>
        <div class="card-body">
            <form method="post" action="/cadusuarios/buscar-vendedores" novalidate id="empresaForm">
                <div class="mb-3">
                    <label for="cnpj" class="form-label">CPF / CNPJ da Empresa</label>
                    <input type="text"
                           class="form-control {% if error %}is-invalid{% endif %}"
                           id="cnpj"
                           name="cnpj"
                           placeholder="Digite CPF ou CNPJ"
                           required>
                    {% if error %}
                    <div class="invalid-feedback">
                        {{ error }}
                    </div>
                    {% else %}
                    <div class="form-text">
                        Informe o CPF (11 dígitos) ou CNPJ (14 dígitos) da empresa.
                    </div>
                    {% endif %}
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-search me-1"></i> Consultar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const input = document.getElementById("cnpj");
    const form = document.getElementById("empresaForm");

    // Máscara adaptativa CPF / CNPJ
    input.addEventListener("input", function(e) {
        let value = e.target.value.replace(/\D/g, ''); // apenas números

        if(value.length <= 11){
            // CPF
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})\.(\d{3})(\d)/, '$1.$2.$3');
            value = value.replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
        } else if(value.length <= 14){
            // CNPJ
            value = value.replace(/^(\d{2})(\d)/, '$1.$2');
            value = value.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
            value = value.replace(/\.(\d{3})(\d)/, '.$1/$2');
            value = value.replace(/(\d{4})(\d)/, '$1-$2');
        }
        e.target.value = value;
    });

    // Limpar máscara antes de enviar
    form.addEventListener("submit", function(e) {
        input.value = input.value.replace(/\D/g, '');
    });
});
</script>
{% endblock %}
