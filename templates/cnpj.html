{% extends "base.html" %}

{% block styles %}
<style>
/* Centraliza conteúdo vertical e horizontal */
.center-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    background: linear-gradient(135deg, #f0f2f5, #d9e2ec);
}

/* Card moderno mantendo tamanho original */
.empresa-card {
    max-width: 400px; /* mantém tamanho proporcional */
    width: auto; /* evita expandir para 100% */
    border-radius: 1rem;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    background-color: #fff;
    margin: 0 auto; /* centraliza */
}

.empresa-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.18);
}

.empresa-card .card-header {
    background: linear-gradient(90deg, #4e54c8, #8f94fb);
    color: #fff;
    font-weight: 700;
    font-size: 1.25rem;
    text-align: center;
    border-top-left-radius: 1rem;
    border-top-right-radius: 1rem;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.5rem;
}

.empresa-card .form-label {
    font-weight: 600;
    color: #333;
}

.empresa-card .form-control {
    border-radius: 0.5rem;
    border: 1px solid rgba(0,0,0,0.15);
    transition: all 0.2s ease;
}

.empresa-card .form-control:focus {
    border-color: #4e54c8;
    box-shadow: 0 0 0 0.2rem rgba(78,84,200,0.25);
}

.empresa-card .btn-primary {
    background: linear-gradient(90deg, #4e54c8, #8f94fb);
    border: none;
    border-radius: 0.5rem;
    font-weight: 700;
    transition: all 0.2s ease;
}

.empresa-card .btn-primary:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
}

.icon-animate {
    display: inline-block;
    animation: bounce 1.2s infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
}
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="empresa-card card shadow-sm">
        <div class="card-header">
            <i class="bi bi-building icon-animate"></i> Selecionar Empresa
        </div>
        <div class="card-body p-4">
            <form method="post" action="/cadusuarios/buscar-vendedores" novalidate id="empresaForm">
                <div class="mb-3">
                    <label for="cnpj" class="form-label">CPF / CNPJ da Empresa</label>
                    <input type="text"
                           class="form-control {% if error %}is-invalid{% endif %}"
                           id="cnpj"
                           name="cnpj"
                           placeholder="Digite CPF ou CNPJ"
                           required>
                    {% if error %}
                    <div class="invalid-feedback">
                        {{ error }}
                    </div>
                    {% else %}
                    <div class="form-text">
                        Informe o CPF (11 dígitos) ou CNPJ (14 dígitos) da empresa.
                    </div>
                    {% endif %}
                </div>
                <div class="d-grid mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-search me-1"></i> Consultar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const input = document.getElementById("cnpj");
    const form = document.getElementById("empresaForm");

    // Máscara adaptativa CPF / CNPJ
    input.addEventListener("input", function(e) {
        let value = e.target.value.replace(/\D/g, '');
        if(value.length <= 11){
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})\.(\d{3})(\d)/, '$1.$2.$3');
            value = value.replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
        } else if(value.length <= 14){
            value = value.replace(/^(\d{2})(\d)/, '$1.$2');
            value = value.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
            value = value.replace(/\.(\d{3})(\d)/, '.$1/$2');
            value = value.replace(/(\d{4})(\d)/, '$1-$2');
        }
        e.target.value = value;
    });

    form.addEventListener("submit", function(e) {
        input.value = input.value.replace(/\D/g, '');
    });
});
</script>
{% endblock %}
