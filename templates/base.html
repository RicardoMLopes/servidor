<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}IBVendas{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- CSS customizado -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/dashboard/base.css') }}">

    {% block styles %}
    {% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Marca d'água animada -->
    <div class="watermark-container" id="watermarks"></div>

    <!-- Navbar fixa -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold disable-mobile" href="/dashboard">
                <span class="text-danger">IB</span><span class="text-white">Vendas</span>
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
                aria-controls="navbarContent"
                aria-expanded="false"
                aria-label="Alternar navegação"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/cadusuarios/">Cadastro Usuários</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="container-fluid mt-5 mb-5 flex-grow-1 d-flex flex-column">
        {% block content %}{% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="bg-light py-3 mt-auto border-top">
        <div class="container text-center">
            <small>© {{ year }} Data Access Informática Ltda - Todos os direitos reservados</small>
        </div>
    </footer>

    <!-- Bootstrap JS (bundle já inclui Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

    <!-- JS customizado -->
    <script src="{{ url_for('static', path='js/dashboard/base.js') }}"></script>

    {% block scripts %} {% endblock %}
</body>
</html>
