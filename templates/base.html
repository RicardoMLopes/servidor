<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Minha Aplicação{% endblock %}</title>

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Google Fonts (opcional) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

    <style>
        body {
            font-family: 'Inter', sans-serif;
            padding-top: 56px; /* espaço para navbar fixa */
            background-color: #f8f9fa;
        }
        footer {
            padding: 1rem 0;
            background-color: #212529;
            color: #fff;
            text-align: center;
            margin-top: 3rem;
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body>
    <!-- Navbar fixa no topo -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Minha Aplicação</a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
                aria-controls="navbarContent"
                aria-expanded="false"
                aria-label="Alternar navegação"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/cadusuarios/">Cadastro Usuários</a>
                    </li>
                    <!-- Adicione mais links aqui se quiser -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="container mt-4 mb-5">
        {% block content %}
        <!-- Conteúdo da página vai aqui -->
        {% endblock %}
    </main>

    <!-- Rodapé -->
    <footer>
        <div class="container">
            <small>© 2025 Sua Empresa - Todos os direitos reservados</small>
        </div>
    </footer>

    <!-- Bootstrap JS (CDN) e Popper -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.7/dist/umd/popper.min.js" integrity="sha384-..." crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js" integrity="sha384-..." crossorigin="anonymous"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
