<div class="col-md-4">
    <div class="card shadow-lg border-0 h-100 rounded-4">
        <div class="card-body">
            <!-- Título elegante -->
            <h5 class="fw-bold text-center mb-4" style="font-size:1.4rem; background: linear-gradient(90deg, #4e54c8, #8f94fb); -webkit-background-clip: text; color: transparent;">
                📷 Upload de Imagens
            </h5>
            <p class="text-muted text-center mb-3">Envie imagens da empresa, produtos ou documentos importantes.</p>

            <!-- Formulário -->
            <form id="formUpload" enctype="multipart/form-data">
                <input type="file" name="files" multiple class="form-control mb-3" required accept="image/*">
                <input type="hidden" name="cnpj" value="{{ empresa_cnpj }}">
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-gradient w-100 fw-bold">Enviar</button>
                    <button type="button" id="btnLimpar" class="btn btn-secondary w-100 fw-bold">Limpar</button>
                </div>
            </form>

            <!-- Loader -->
            <div id="loaderUpload" class="text-center mt-3" style="display:none;">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Processando imagens...</p>
            </div>

            <!-- Mensagem de sucesso/erro -->
            <div id="msgUpload" class="alert mt-3" style="display:none;"></div>

            <!-- Pré-visualização das imagens -->
            <div id="previewUpload" class="mt-3 d-flex flex-wrap gap-2"></div>
        </div>
    </div>
</div>

<script>
const formUpload = document.getElementById('formUpload');
const loader = document.getElementById('loaderUpload');
const msgUpload = document.getElementById('msgUpload');
const preview = document.getElementById('previewUpload');
const btnLimpar = document.getElementById('btnLimpar');

formUpload.addEventListener('submit', async (e) => {
    e.preventDefault();

    const inputFiles = formUpload.querySelector('input[name="files"]').files;
    if (!inputFiles.length) return;

    // Limpa pré-visualização anterior
    preview.innerHTML = '';
    msgUpload.style.display = 'none';

    loader.style.display = 'block';

    // Remove máscara do CNPJ
    const cnpjOriginal = formUpload.querySelector('input[name="cnpj"]').value;
    const cnpj = cnpjOriginal.replace(/\D/g, '');

    const formData = new FormData();
    formData.append('cnpj', cnpj);
    for (let file of inputFiles) formData.append('files', file);

    try {
        const response = await fetch('/image/upload', {
            method: 'POST',
            body: formData
        });
        const data = await response.json();

        loader.style.display = 'none';

        if (data.success) {
            msgUpload.textContent = data.msg;
            msgUpload.className = 'alert alert-success mt-3';
            msgUpload.style.display = 'block';

            // Pré-visualiza as imagens processadas
            data.arquivos.forEach(arquivo => {
                const img = document.createElement('img');
                img.src = `/static/img/${cnpj}/${arquivo}`;
                img.style.width = '80px';
                img.style.height = '80px';
                img.style.objectFit = 'cover';
                img.classList.add('border', 'shadow-sm', 'rounded');
                preview.appendChild(img);
            });

            formUpload.reset();
        } else {
            msgUpload.textContent = data.msg || 'Erro ao processar imagens.';
            msgUpload.className = 'alert alert-danger mt-3';
            msgUpload.style.display = 'block';
        }
    } catch (err) {
        console.error(err);
        loader.style.display = 'none';
        msgUpload.textContent = 'Erro ao processar imagens.';
        msgUpload.className = 'alert alert-danger mt-3';
        msgUpload.style.display = 'block';
    }
});

// Botão Limpar
btnLimpar.addEventListener('click', () => {
    formUpload.reset();
    preview.innerHTML = '';
    msgUpload.style.display = 'none';
});
</script>

<style>
.btn-gradient {
    background: linear-gradient(90deg, #4e54c8, #8f94fb);
    color: #fff;
    border: none;
    font-weight: bold;
    transition: 0.2s;
}
.btn-gradient:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
}
</style>
