<div class="col-lg-4">

  <!-- Card do Cliente Estilizado -->
  <div class="card shadow-sm border-0 p-4 mb-4 bg-white rounded-4 border-start border-primary border-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold text-dark m-0"><i class="bi bi-person-badge text-primary me-2"></i>Cliente</h5>
      <small class="text-muted">Principal</small>
    </div>

    <!-- Bloco transformado em DIV clicável via data-attributes do Bootstrap (Sem conflito de <a>) -->
    <div class="p-3 bg-light rounded-3 border-0 cursor-pointer transition-hover"
         data-bs-toggle="modal"
         data-bs-target="#modalSelecionarCliente"
         style="cursor: pointer;">
      <span id="infoClienteNome" class="fw-bold text-primary fs-6 d-block text-truncate">
        {{ nome_cliente_padrao if nome_cliente_padrao else "Cliente não encontrado" }}
      </span>
      <small id="infoClienteDoc" class="text-muted d-block mt-1">
        CPF/CNPJ: {{ doc_cliente_padrao if doc_cliente_padrao else "—" }}
      </small>
      <div class="mt-2 text-primary small fw-semibold">
        <i class="bi bi-pencil-square me-1"></i> Clique para alterar o cliente
      </div>
    </div>
  </div>

  <!-- Botão Faturar Destacado -->
  <div class="d-grid">
    <button type="button" class="btn btn-success btn-lg fw-bold py-3 shadow-sm rounded-4" data-bs-toggle="modal" data-bs-target="#modalFaturar">
      <i class="bi bi-cart-check-fill me-2"></i> FATURAR PEDIDO
    </button>
  </div>

</div>
