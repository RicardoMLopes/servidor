<div class="modal fade" id="modalSelecionarCliente" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-bold"><i class="bi bi-search me-2"></i>Pesquisar Cliente</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <div class="input-group mb-3">
          <input type="text" class="form-control" id="buscaClienteInput" placeholder="Digite o Nome ou CPF/CNPJ do cliente..." oninput="filtrarClientes(this.value)">
          <button class="btn btn-primary" type="button"><i class="bi bi-search"></i></button>
        </div>
        <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
          <table class="table table-hover align-middle">
            <thead class="table-light sticky-top">
              <tr>
                <th>Código</th>
                <th>Nome / Razão Social</th>
                <th>CPF / CNPJ</th>
                <th class="text-center">Ação</th>
              </tr>
            </thead>
            <tbody id="listaClientesResultado">
              <!-- Os clientes encontrados na busca via API aparecerão aqui automaticamente -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
