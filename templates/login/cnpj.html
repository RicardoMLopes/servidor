<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - IBVendas</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- CSS específico do login -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/login/login_cnpj.css') }}">
    <!-- CSS customizado -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/dashboard/base.css') }}">
</head>
<body class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <!-- Marca d'água animada -->
    <div class="watermark-container" id="watermarks"></div>

    <div class="empresa-card card shadow-sm" style="max-width: 400px; width: 100%;">
        <div class="card-header">
            <i class="bi bi-building icon-animate"></i> Selecionar Empresa
        </div>
        <div class="card-body p-4">
            <form method="post" action="/cadusuarios/buscar-vendedores" novalidate id="empresaForm">
                <div class="mb-3">
                    <label for="cnpj" class="form-label">CPF / CNPJ da Empresa</label>
                    <input type="text"
                           class="form-control {% if error %}is-invalid{% endif %}"
                           id="cnpj"
                           name="cnpj"
                           placeholder="Digite CPF ou CNPJ"
                           required>
                    {% if error %}
                    <div class="invalid-feedback">
                        {{ error }}
                    </div>
                    {% else %}
                    <div class="form-text">
                        Informe o CPF (11 dígitos) ou CNPJ (14 dígitos) da empresa.
                    </div>
                    {% endif %}
                </div>
                <div class="d-grid mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-search me-1"></i> Consultar
                    </button>
                </div>
            </form>

            <!-- Mensagem de erro -->
            <div id="msgErro" class="alert alert-danger mt-3 d-none"></div>

            <!-- Área para mostrar dados da empresa -->
            <div id="empresaDados" class="mt-4 d-none">
                <h5 class="fw-bold">Dados da Empresa</h5>
                <p><strong>Nome:</strong> <span id="nomeEmpresa"></span></p>
                <p><strong>CNPJ:</strong> <span id="cnpjEmpresa"></span></p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS específico do login -->
    <script src="{{ url_for('static', path='js/login/login_cnpj.js') }}"></script>

    <!-- JS globais -->
    <script src="{{ url_for('static', path='js/dashboard/base.js') }}"></script>
</body>
</html>
