<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ empresa_nome }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .login-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, .06);
            overflow: hidden;
        }
        .login-header {
            padding: 28px 28px 20px;
            text-align: center;
        }
        .login-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 16px;
            border-radius: 14px;
            background: #eff6ff;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
        }
        .login-title {
            margin: 0;
            color: #0f172a;
            font-size: 22px;
            font-weight: 700;
        }
        .login-subtitle {
            margin-top: 6px;
            color: #64748b;
            font-size: 14px;
        }
        .empresa-info {
            margin: 0 28px 20px;
            padding: 12px 14px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }
        .empresa-nome {
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }
        .empresa-cnpj {
            margin-top: 3px;
            color: #64748b;
            font-size: 12px;
        }
        .login-body {
            padding: 0 28px 28px;
        }
        .form-label {
            color: #334155;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .form-control {
            min-height: 44px;
            border-color: #cbd5e1;
            border-radius: 9px;
        }
        .form-control:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 .2rem rgba(37, 99, 235, .12);
        }
        .btn-login {
            min-height: 44px;
            border-radius: 9px;
            font-weight: 600;
        }
        .trocar-empresa {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #2563eb;
            font-size: 13px;
            text-decoration: none;
        }
        .trocar-empresa:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <i class="bi bi-person-lock"></i>
                </div>

                <h1 class="login-title">Login do usuário</h1>
                <div class="login-subtitle">
                    Informe seus dados para continuar
                </div>
            </div>

            <div class="empresa-info">
                <div class="empresa-nome">
                    <i class="bi bi-building me-1"></i>
                    {{ empresa_nome }}
                </div>
                <div class="empresa-cnpj">
                    CNPJ: {{ empresa_cnpj }}
                </div>
            </div>

            <div class="login-body">
                {% if error %}
                <div class="alert alert-danger py-2 px-3 small" role="alert">
                    <i class="bi bi-exclamation-circle me-1"></i>
                    {{ error }}
                </div>
                {% endif %}

                <form method="post" action="/autenticar-usuario">
                    <div class="mb-3">
                        <label for="usuario" class="form-label">
                            Usuário
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="usuario"
                            name="usuario"
                            autocomplete="username"
                            required
                            autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="senha" class="form-label">
                            Senha
                        </label>
                        <input
                            type="password"
                            class="form-control"
                            id="senha"
                            name="senha"
                            autocomplete="current-password"
                            required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-login">
                        <i class="bi bi-box-arrow-in-right me-1"></i>
                        Entrar
                    </button>
                </form>

                <a href="/" class="trocar-empresa">
                    <i class="bi bi-arrow-left me-1"></i>
                    Trocar empresa
                </a>
            </div>
        </div>
    </div>
</body>
</html>
