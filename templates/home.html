<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - IBVendas</title>

    <!-- CSS globais -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- CSS customizado -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/dashboard/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/dashboard/dashboard.css') }}">
</head>
<body>
<div class="container py-5">
    <!-- Marca d'água animada -->
    <div class="watermark-container" id="watermarks"></div>

    <!-- Card de acesso à empresa -->
    <div id="empresaCard" class="row justify-content-center mb-5">
        <div class="col-md-6">
            <div class="card shadow-lg p-4" style="border-radius: 1rem;">
                <div class="text-center mb-3">
                    <img src="/static/img/empresa.png" alt="Logo" style="width:80px;" class="mb-3">
                    <h2 class="fw-bold">Acesso à Empresa</h2>
                    <p class="text-muted">Digite seu CPF ou CNPJ</p>
                </div>
                <form id="formEmpresa">
                    <div class="input-group mb-3 shadow-sm" style="border-radius: 0.5rem; overflow: hidden;">
                        <span class="input-group-text bg-gradient-primary text-white">
                            <i class="bi bi-building-fill"></i>
                        </span>
                        <input type="text" class="form-control form-control-lg" id="cnpj" placeholder="CPF ou CNPJ" required>
                    </div>
                    <button type="submit" class="btn btn-lg w-100 fw-bold text-white btn-gradient">Consultar</button>
                </form>

                <!-- Loader -->
                <div id="loader" class="text-center mt-3 d-none">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Carregando...</span>
                    </div>
                    <p class="mt-2 text-muted">Consultando empresa...</p>
                </div>

                <!-- Área para mostrar dados da empresa -->
                <div id="empresaDados" class="mt-4 d-none">
                    <h5 class="fw-bold">Dados da Empresa</h5>
                    <p><strong>Nome:</strong> <span id="nomeEmpresa"></span></p>
                    <p><strong>CNPJ:</strong> <span id="cnpjEmpresa"></span></p>
                </div>

                <!-- Mensagem de erro -->
                <div id="msgErro" class="alert alert-danger mt-3 d-none"></div>
            </div>
        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

<!-- JS globais -->
<script src="{{ url_for('static', path='js/dashboard/base.js') }}?v=2"></script>

<!-- JS específico do login -->
<script src="{{ url_for('static', path='js/dashboard/dashboard.js')}}?v=2"></script>
</body>
</html>
